name: Build & Publish Dashboard
on:
  workflow_run:
    workflows: ["Scheduled Monitor"]   # rename to match your monitor workflow's name:
    types: [completed]
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build static dashboard
        run: python generate_static_dashboard.py
      - uses: actions/upload-pages-artifact@v3
        with: { path: dashboard }
      - id: deploy
        uses: actions/deploy-pages@v4
